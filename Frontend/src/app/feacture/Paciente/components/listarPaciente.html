<table class="table">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Nombre</th>
      <th scope="col">numero de documento</th>
      <th scope="col">activo</th>
    </tr>
  </thead>
  <tbody>
    @for (item of data(); track item.id) {
      <tr>
        <th scope="row">{{ item.id }}</th>
        <td>{{ item.nombre }}</td>
        <td>{{ item.numeroDocumento }}</td>
        <td>{{ item.activo ? 'Activo' : 'Innactivo' }}</td>
      </tr>
    }
  </tbody>
</table>
